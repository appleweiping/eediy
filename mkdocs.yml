site_name: EEDIY
site_description: 面向电子工程学习者的双语课程导航、路线规划与项目实践指南
site_author: EEDIY Contributors
site_url: https://appleweiping.github.io/eediy/
repo_url: https://github.com/appleweiping/eediy
repo_name: appleweiping/eediy
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 EEDIY Contributors

docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/images/eediy-mark.png
  favicon: assets/images/eediy-mark.png
  font:
    text: Roboto Slab
    code: Roboto Mono
  features:
    - header.autohide
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: 切换至深色 / Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 切换至浅色 / Switch to light
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: 锚点链接 / Permalink
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

extra:
  generator: false
  navigation_requires_all_docs: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/appleweiping/eediy
  alternate:
    - name: 简体中文
      link: /
      lang: zh-Hans
    - name: English
      link: /en/
      lang: en
  status:
    verified: 已核验 / Verified
    review: 待复核 / Review due

