name: Learning experience or course update / 学习经验或课程更新
description: Share first-hand completion notes or evidence-backed changes to prerequisites, workload, tools, access, or materials.
title: "[Course feedback] "
labels:
  - course
  - needs-review
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助下一位学习者做出更可靠的决定。请明确区分亲历经验、维护者建议和可由来源核验的事实。
        Thank you for helping the next learner make a better decision. Clearly separate first-hand experience, editorial advice, and facts that a source can verify.
  - type: input
    id: course_id
    attributes:
      label: Stable course ID / 稳定课程 ID
      description: Keep the prefilled course-NNN value when opened from a course page.
      placeholder: course-021
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Canonical EEDIY page / EEDIY 规范页面
      description: Chinese and English versions intentionally share this context.
    validations:
      required: true
  - type: input
    id: reported_page
    attributes:
      label: Page where the report started / 发起反馈的页面
      description: Preserves the exact Chinese or English page that opened this form.
    validations:
      required: true
  - type: input
    id: reported_language
    attributes:
      label: Reported page language / 发起页面语言
      description: Prefilled as en or zh-Hans when opened from an EEDIY course page.
      placeholder: en or zh-Hans
    validations:
      required: true
  - type: dropdown
    id: feedback_kind
    attributes:
      label: Feedback type / 反馈类型
      options:
        - First-hand completion experience / 亲历完课经验
        - Workload or pacing calibration / 工时或节奏校准
        - Prerequisite correction or warning / 先修修正或提醒
        - Resource, version, access, or tooling update / 资源、版本、访问或工具更新
        - Assignment, laboratory, or project feedback path / 作业、实验或项目反馈路径
        - Accessibility, region, cost, or safety constraint / 无障碍、地区、成本或安全约束
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: What you observed / 你的观察
      description: State what you actually attempted, under which version and access conditions. Do not imply completion if you sampled only part of the course.
      placeholder: |
        Course/material version:
        What I attempted:
        Access, tools, and equipment:
        Observation:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verifiable evidence, if applicable / 可核验证据（如适用）
      description: Link official pages, public artifacts, or reproducible measurements. First-hand workload notes may instead describe the measurement method and sample size.
  - type: textarea
    id: suggested_change
    attributes:
      label: Suggested bilingual update / 建议的双语更新
      description: Identify what should change, where it belongs, and what uncertainty should remain visible.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Contributor checks / 贡献者确认
      options:
        - label: I separated first-hand experience from sourced facts and editorial inference.
          required: true
        - label: I did not include restricted answers, credentials, personal data, or unlicensed copies.
          required: true
        - label: I disclosed any relationship to the course provider or resource.
          required: true
