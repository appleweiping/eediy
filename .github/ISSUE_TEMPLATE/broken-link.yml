name: Broken or restricted link / 链接异常
description: Report a missing, moved, policy-blocked, or degraded resource.
title: "[Link] "
labels:
  - link
  - needs-review
body:
  - type: markdown
    attributes:
      value: |
        从课程、方向或路线页进入时，稳定页面 ID 和规范页面地址会自动填写。不要粘贴账号、Cookie、令牌或私有课程材料。
        When opened from a course, track, or route page, the stable page ID and canonical page are prefilled. Never paste accounts, cookies, tokens, or private course material.
  - type: input
    id: page_id
    attributes:
      label: Stable page ID / 稳定页面 ID
      description: Keep the prefilled course-NNN, track-slug, or route-slug value.
      placeholder: course-021, track-circuits, or route-essential-core
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: EEDIY page / 所在页面
      description: The canonical Chinese/English pair shares this page context.
    validations:
      required: true
  - type: input
    id: reported_page
    attributes:
      label: Page where the report started / 发起反馈的页面
      description: Preserves the exact Chinese or English page that opened this form.
    validations:
      required: true
  - type: input
    id: reported_language
    attributes:
      label: Reported page language / 发起页面语言
      description: Prefilled as en or zh-Hans when opened from an EEDIY page.
      placeholder: en or zh-Hans
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected URL / 异常链接
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: symptom
    attributes:
      label: Observed result / 观察结果
      options:
        - Not found or removed
        - Access denied or robots restriction
        - Login or payment required
        - Redirect loop or wrong destination
        - Important material missing
        - Certificate or connection failure
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Time, region, status, and reproduction / 时间、地区、状态与复现
      description: Do not include accounts, cookies, tokens, or personal data.
    validations:
      required: true
  - type: input
    id: replacement
    attributes:
      label: Official replacement, if known / 官方替代链接
  - type: checkboxes
    id: checks
    attributes:
      label: Checks / 确认
      options:
        - label: I tested the link without exposing private account data.
          required: true
        - label: I understand policy denials require manual review and are not healthy responses.
          required: true
