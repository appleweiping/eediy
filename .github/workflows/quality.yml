name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Data, docs, tests, and strict build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install executable EE toolchains
        env:
          KICAD_APT_VERSION: 8.0.9-0~ubuntu24.04.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            gcc \
            g++ \
            iverilog \
            "kicad=$KICAD_APT_VERSION" \
            ngspice \
            ninja-build \
            verilator \
            yosys \
            z3
          cmake --version
          gcc --version
          ngspice --version
          iverilog -V
          verilator --version
          yosys --version
          z3 --version
          test "$(kicad-cli version)" = "8.0.9"

      - name: Install pinned SymbiYosys
        env:
          SBY_COMMIT: fea6e467d067b3ea84b6b5ac08cd48beb59f0d42
        run: |
          git clone --filter=blob:none https://github.com/YosysHQ/sby.git "$RUNNER_TEMP/sby"
          git -C "$RUNNER_TEMP/sby" checkout --detach "$SBY_COMMIT"
          test "$(git -C "$RUNNER_TEMP/sby" rev-parse HEAD)" = "$SBY_COMMIT"
          sudo make -C "$RUNNER_TEMP/sby" install PREFIX=/usr/local
          sby --version

      - name: Check dependency consistency
        run: |
          python -m pip check
          python scripts/check_dependency_lock.py

      - name: Check canonical data drift
        run: |
          python scripts/enrich_official_resources.py --validate-only
          python scripts/compile_courses.py --check
          python scripts/apply_course_editorial.py --check

      - name: Validate courses and routes
        run: |
          python scripts/validate_courses.py
          python scripts/validate_mainline_audit.py
          python scripts/validate_routes.py
          python scripts/check_course_guides.py --require-track-coverage --require-mainline-coverage

      - name: Check editorial quality for changed course guides
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_editorial_quality.py
          --changed-from "${{ github.event.pull_request.base.sha }}"
          --warnings-as-errors
          --json-report build/editorial-quality.json

      - name: Check editorial quality for the full guide corpus
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/check_editorial_quality.py
          --warnings-as-errors
          --json-report build/editorial-quality.json

      - name: Check generated page drift
        run: |
          python scripts/generate_course_pages.py --check
          python scripts/sync_navigation.py --check

      - name: Check translations, navigation, links, and managed text
        run: |
          python scripts/check_translations.py
          python scripts/check_navigation.py
          python scripts/check_markdown_links.py
          python scripts/check_forbidden_terms.py

      - name: Run unit tests
        run: python -m pytest -q

      - name: Execute all release-blocking EE starter toolchains
        run: python scripts/run_executable_examples.py --require-tools all

      - name: Check every external resource with fresh network evidence
        run: >-
          python scripts/check_external_links.py
          --allow-review
          --workers 24
          --timeout 8
          --retries 1
          --cache-ttl-hours 0

      - name: Build consolidated report
        if: always()
        run: python scripts/quality_report.py --require-external --warnings-as-errors

      - name: Build documentation with warnings as errors
        run: python -m mkdocs build --strict --site-dir site

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-report-${{ github.run_id }}
          path: |
            build/quality-report.json
            build/quality-report.md
            build/editorial-quality.json
            build/external-links.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the tested Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish the tested Pages artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the current main head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Reject a stale workflow rerun
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Deploy the exact artifact produced by Quality
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
